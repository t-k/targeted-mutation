name: Release

on:
  push:
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    name: Verify release package
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v6.1.0
        with:
          persist-credentials: false
      - name: Verify the Actions lockfile
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh extension install github/gh-actions-lock --pin v0.4.1
          gh actions-lock --verify
      - name: Install stable Rust
        run: rustup toolchain install stable --profile minimal
      - name: Check tag version
        if: github.ref_type == 'tag'
        env:
          TAG: ${{ github.ref_name }}
        run: |
          version="$(cargo +stable metadata --locked --no-deps --format-version 1 |
            jq -er '.packages[] | select(.name == "targeted-mutation") | .version')"
          if [[ "$TAG" != "v$version" ]]; then
            printf 'Tag %s does not match Cargo.toml version %s\n' "$TAG" "$version" >&2
            exit 1
          fi
      - name: Build and verify the package
        run: cargo +stable publish --locked --dry-run

  publish:
    name: Publish to crates.io
    if: github.event_name == 'push' && github.ref_type == 'tag'
    needs: validate
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    environment: crates-io
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v6.1.0
        with:
          persist-credentials: false
      - name: Install stable Rust
        run: rustup toolchain install stable --profile minimal
      - name: Authenticate with crates.io
        id: crates-io-auth
        uses: rust-lang/crates-io-auth-action@v1.0.6
      # The package was built in the validation job without access to the OIDC token.
      - name: Publish the verified package
        run: cargo +stable publish --locked --no-verify
        env:
          CARGO_REGISTRY_TOKEN: ${{ steps.crates-io-auth.outputs.token }}
