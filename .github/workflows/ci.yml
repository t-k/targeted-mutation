name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always

jobs:
  check:
    name: Format, lint, unit tests
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v6.1.0
        with:
          persist-credentials: false
      # The runner comes with rustup; no action is needed to get a toolchain.
      - name: Install the stable toolchain
        run: |
          rustup toolchain install stable --profile minimal --component clippy --component rustfmt
          rustup default stable
          rustc --version
      - name: Format
        run: cargo fmt --check
      - name: Lint
        run: cargo clippy --all-targets -- -D warnings
      - name: Unit tests, the parity check and the doc tests
        run: |
          cargo test --lib --bins --test parity
          cargo test --doc

  # The integration tests build and analyse the crates under fixtures/, each with many
  # test runs of its own. They are spread over several runners, and on each of them only
  # two run at a time: a runner that is starved loses its connection, and with it the log.
  # Every file under tests/ is taken in (but for the parity check, which runs above), so
  # that a test file that is added is run without anyone having to list it here.
  integration:
    name: Integration tests (${{ matrix.part }} of 6)
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        part: [1, 2, 3, 4, 5, 6]
    steps:
      - uses: actions/checkout@v6.1.0
        with:
          persist-credentials: false
      - name: Install the stable toolchain
        run: |
          rustup toolchain install stable --profile minimal
          rustup default stable
      - name: Build the tests
        run: cargo test --tests --no-run
      - name: Choose the tests of this part
        run: |
          for file in tests/*.rs; do
            target="$(basename "$file" .rs)"
            if [ "$target" != parity ]; then
              cargo test --test "$target" -- --list --format terse \
                | sed -n 's/: test$//p' | sed "s/^/$target /"
            fi
          done > all-tests.txt
          awk -v part=${{ matrix.part }} 'NR % 6 == part % 6' all-tests.txt > tests-of-this-part.txt
          wc -l < all-tests.txt
          cat tests-of-this-part.txt
          test -s tests-of-this-part.txt
      - name: Run them
        run: |
          for target in $(cut -d' ' -f1 tests-of-this-part.txt | sort -u); do
            awk -v target="$target" '$1 == target { print $2 }' tests-of-this-part.txt \
              | xargs cargo test --test "$target" -- --exact --test-threads=2
          done

  msrv:
    name: Builds with the oldest supported Rust (1.88)
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v6.1.0
        with:
          persist-credentials: false
      - name: Check with Rust 1.88
        run: |
          rustup toolchain install 1.88.0 --profile minimal
          cargo +1.88.0 check --all-targets

  lockfile:
    name: The lockfile of the actions is current
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v6.1.0
        with:
          persist-credentials: false
      - name: Verify .github/workflows/actions.lock
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh extension install github/gh-actions-lock --pin v0.4.1
          gh actions-lock --verify
