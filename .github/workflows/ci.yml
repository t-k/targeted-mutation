name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always

jobs:
  check:
    name: Format, lint, unit tests
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v6.1.0
        with:
          persist-credentials: false
      # The runner comes with rustup; no action is needed to get a toolchain.
      - name: Install the stable toolchain
        run: |
          rustup toolchain install stable --profile minimal --component clippy --component rustfmt
          rustup default stable
          rustc --version
      - name: Format
        run: cargo fmt --check
      - name: Lint
        run: cargo clippy --all-targets -- -D warnings
      - name: Unit tests and the parity check
        run: cargo test --lib --bins --test parity

  # The end-to-end tests build and analyse the crates under fixtures/, each with many
  # test runs of its own. They are spread over several runners, and on each of them only
  # two run at a time: a runner that is starved loses its connection, and with it the log.
  e2e:
    name: End-to-end tests (${{ matrix.part }} of 6)
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        part: [1, 2, 3, 4, 5, 6]
    steps:
      - uses: actions/checkout@v6.1.0
        with:
          persist-credentials: false
      - name: Install the stable toolchain
        run: |
          rustup toolchain install stable --profile minimal
          rustup default stable
      - name: Build the tests
        run: cargo test --test e2e --no-run
      - name: Choose the tests of this part
        run: |
          cargo test --test e2e -- --list --format terse \
            | sed -n 's/: test$//p' \
            | awk -v part=${{ matrix.part }} 'NR % 6 == part % 6' > tests-of-this-part.txt
          cat tests-of-this-part.txt
          test -s tests-of-this-part.txt
      - name: Run them
        run: |
          xargs cargo test --test e2e -- --exact --test-threads=2 < tests-of-this-part.txt

  msrv:
    name: Builds with the oldest supported Rust (1.88)
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v6.1.0
        with:
          persist-credentials: false
      - name: Check with Rust 1.88
        run: |
          rustup toolchain install 1.88.0 --profile minimal
          cargo +1.88.0 check --all-targets

  lockfile:
    name: The lockfile of the actions is current
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v6.1.0
        with:
          persist-credentials: false
      - name: Verify .github/workflows/actions.lock
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh extension install github/gh-actions-lock --pin v0.4.1
          gh actions-lock --verify
