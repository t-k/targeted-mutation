[package]
name = "targeted-mutation"
version = "0.1.0"
edition = "2024"

[dependencies]
anyhow = "1.0.104"
clap = { version = "4.6.8", features = ["derive"] }
proc-macro2 = { version = "1.0.107", features = ["span-locations"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
syn = { version = "2", features = ["full", "visit"] }
