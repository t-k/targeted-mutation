[package]
name = "targeted-mutation"
version = "0.2.1"
edition = "2024"
rust-version = "1.88"
license = "Apache-2.0"
description = "Targeted mutation testing for Rust: find the wrong implementations your tests let through"
repository = "https://github.com/t-k/targeted-mutation"
readme = "README.md"
keywords = ["mutation-testing", "testing", "cargo", "subcommand", "mutants"]
categories = ["development-tools::testing", "development-tools::cargo-plugins", "command-line-utilities"]
# The tests need the crates under fixtures/, which cargo leaves out of a package (each is
# a package of its own): they are run from the repository, not from the published crate.
exclude = ["fixtures", "formal", "docs.local", "tests", "eval", ".github"]

[[bin]]
name = "cargo-tmt"
path = "src/main.rs"

[dependencies]
anyhow = "1.0.104"
clap = { version = "4.6.8", features = ["derive"] }
quote = "1"
proc-macro2 = { version = "1.0.107", features = ["span-locations"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
syn = { version = "2", features = ["full", "visit"] }
toml_edit = "0.25.19"
sha2 = "0.10.9"
