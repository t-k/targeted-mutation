[package]
name = "targeted-mutation"
version = "0.1.0"
edition = "2024"
license = "Apache-2.0"
description = "Targeted mutation testing for Rust: find the wrong implementations your tests let through"
exclude = ["fixtures/*/target", "formal", "docs.local"]

[[bin]]
name = "tmt"
path = "src/main.rs"

[dependencies]
anyhow = "1.0.104"
clap = { version = "4.6.8", features = ["derive"] }
quote = "1"
proc-macro2 = { version = "1.0.107", features = ["span-locations"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
syn = { version = "2", features = ["full", "visit"] }
toml_edit = "0.25.19"
